layout: default
---

<link rel="stylesheet" href="{{ site.baseurl }}style/note.css">

<div class="page">
    <a href="{{ site.baseurl }}">&larr; Home</a>
  <h1 class="page-title">{{ page.title }}</h1>
  
  <div id="note">

</div>

<div id="last_update">
    <i>Last updated {{ page.date | date_to_long_string: "ordinal" }}.</i>
    
</div>
